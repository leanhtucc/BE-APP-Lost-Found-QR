services:
  # Web Service (API)
  - type: web
    name: backend-api
    runtime: node
    region: oregon # or singapore for closer to Vietnam
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run prisma:deploy && npm start
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        value: https://nbjalqpohrkooxlnrzof.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_fpv2xfY1MbPwGOVSC_BWzQ_Nf9yH9yK
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        value: https://nbjalqpohrkooxlnrzof.supabase.co/auth/v1/.well-known/jwks.json
      - key: SUPABASE_STORAGE_BUCKET
        value: item-images
      - key: GOOGLE_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-2.5-flash
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: GUEST_JWT_SECRET
        sync: false
      - key: HANDOVER_CODE_SALT
        generateValue: true
      - key: STREAM_TOKEN_TTL_SECONDS
        value: 3600
      - key: GUEST_JWT_TTL
        value: 6h
      - key: GUEST_JWT_MAX_AGE
        value: 72h
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: GUEST_CLAIM_INACTIVE_HOURS
        value: 48
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: API_PREFIX
        value: /api
      - key: SKIP_EMAIL_VERIFICATION
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: VNPAY_TMN_CODE
        sync: false
      - key: VNPAY_HASH_SECRET
        sync: false
      - key: VNPAY_PAYMENT_URL
        value: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      - key: VNPAY_RETURN_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      # Add other environment variables manually in Render dashboard
