services:
  # Web Service (API)
  - type: web
    name: backend-api
    runtime: node
    env: node
    region: oregon # or singapore for closer to Vietnam
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: backend-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: API_PREFIX
        value: /api
      - key: SKIP_EMAIL_VERIFICATION
        value: false
      # Add other environment variables manually in Render dashboard

  # PostgreSQL Database
databases:
  - name: backend-db
    databaseName: backend_db
    user: backend_user
    region: oregon # or singapore
    plan: free
