services:
  # Web Service (API)
  - type: web
    name: backend-api
    runtime: node
    region: oregon # or singapore for closer to Vietnam
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run prisma:deploy && npm start
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        value: https://nbjalqpohrkooxlnrzof.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_fpv2xfY1MbPwGOVSC_BWzQ_Nf9yH9yK
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        value: https://nbjalqpohrkooxlnrzof.supabase.co/auth/v1/.well-known/jwks.json
      - key: SUPABASE_STORAGE_BUCKET
        value: item-images
      - key: GOOGLE_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-2.5-flash
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: API_PREFIX
        value: /api
      - key: SKIP_EMAIL_VERIFICATION
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      # Add other environment variables manually in Render dashboard
