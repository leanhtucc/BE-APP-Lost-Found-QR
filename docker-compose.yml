version: "3.8"

services:
  backend:
    build: .
    container_name: backend-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    command: sh -c "npx prisma migrate deploy && npm start"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
